# AIapi 部署（单容器：默认一个 3065 端口，既是管理面板也是 OpenAI 兼容网关）。
#
#   docker compose up -d --build
#
#   面板     http://<主机>:3065    （首次打开注册管理员账号，之后账号密码登录）
#   网关     http://<主机>:3065/v1 （API Key 在面板「网关 Key」页创建；OpenAI 兼容）
#
# 可选：面板分端口（AIAPI_PANEL_PORT，改名前的 AGENT2API_PANEL_PORT 仍可读）
# ——设置后管理面（界面 + /api/*）
# 单独监听该端口，主端口只保留 /v1/* 网关。想把面板留在内网时：在 .env 里
# 设置 AIAPI_PANEL_PORT=3066，然后只映射网关端口：
#
#   ports:
#     - "3065:3065"    # 网关（/v1/*），公网可暴露
#     - "127.0.0.1:3066:3066"   # 面板：只绑本机回环，不暴露公网
#
# 数据全部落在 ./data 一个卷里。

services:
  aiapi:
    build: .
    image: aiapi:local
    container_name: aiapi
    restart: unless-stopped
    ports:
      - "3065:3065"
    environment:
      # 面板管理员：可选。不设时走登录页注册（首次打开面板即提示）；
      # 无人值守 / IaC 部署才需要在这里预置（密码明文填，启动时自动
      # 转 bcrypt 哈希，库里只存哈希）。
      #
      # 变量改名为 AIAPI_*，但 .env 里写改名前的 AGENT2API_* 仍可用：
      # 这里用嵌套默认值「新名优先、旧名兜底」，容器内只注入一个变量 ——
      # 不能两行都传，否则新名恒为空串会遮蔽旧名的值（代码按新名 > 旧名
      # 依次读，空串也算「已设置」）。
      AIAPI_ADMIN_USER: ${AIAPI_ADMIN_USER:-${AGENT2API_ADMIN_USER:-}}
      AIAPI_ADMIN_PASSWORD: ${AIAPI_ADMIN_PASSWORD:-${AGENT2API_ADMIN_PASSWORD:-}}
      # 可选：面板分端口（见文件头说明）。不设则面板与网关同在 3065。
      AIAPI_PANEL_PORT: ${AIAPI_PANEL_PORT:-${AGENT2API_PANEL_PORT:-}}
      # 登录页人机验证组件环境变量，默认为0关闭，1为开启
      AIAPI_CAPTCHA_ENABLED: ${AIAPI_CAPTCHA_ENABLED:-${AGENT2API_CAPTCHA_ENABLED:-0}}
      # ── 面板一键更新（默认关闭，按需开启）────────────────────────
      # 设 1 后，面板更新按钮变成真的「一键更新」：后端经下面的 docker.sock
      # 拉起一次性更新器去 pull + 重建本容器。
      # ⚠️ 安全代价：挂载 docker.sock 等于把宿主机 Docker 的完全控制权交给本容器。
      #    只在**自己的私有机（局域网 / 单用户）**开启；公网暴露或多人可登面板时不要开。
      AIAPI_ALLOW_SELF_UPDATE: ${AIAPI_ALLOW_SELF_UPDATE:-0}
      # 其余可选变量（AIAPI_VERBOSE / AIAPI_ALLOW_NO_KEY / AIAPI_PROXY_PORT）
      # 与旧名 AGENT2API_* 都要生效，需像上面那样自行加转发行 —— 只写进
      # .env 而不在这里列出的话，本来就进不了容器（与改名前一致）。
    volumes:
      # 全部状态（SQLite 库、配置、日志）都在这一个卷里
      - ./data:/data
    # ── 面板一键更新所需的 socket 挂载（默认关闭，与 AIAPI_ALLOW_SELF_UPDATE 配套）──
    # 开启一键更新时才取消下面这行的注释：
    # - /var/run/docker.sock:/var/run/docker.sock
