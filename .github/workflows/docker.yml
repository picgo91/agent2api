name: docker

# 构建网关镜像（amd64 + arm64）并推送到 **你自己的** Docker Hub。
#
# ── 这是分叉自上游 picgo91/agent2api 后改过的版本 ────────────
# 原文件把镜像写死成 picgo91/agent2api（作者的账号）；这里改成
# `${{ secrets.DOCKERHUB_USERNAME }}/agent2api`，即推到你自己的账号，
# 这样你改完代码 push 就能自动构建上架，不必等作者发版。
#
# ── 触发方式 ──────────────────────────────────────────────────
#   · push 到 main / master：产出 <你>/agent2api:latest
#   · 手动 workflow_dispatch（Actions 页面点 Run workflow）：同上
#   · 推送 v* tag：额外产出 <你>/agent2api:<版本号>
#   每次还会带一个短 SHA tag（如 :sha-1a2b3c4），便于回溯到具体提交。
#
# ── 需要配置的 secrets（仓库 Settings → Secrets and variables → Actions）──
#   DOCKERHUB_USERNAME  你的 Docker Hub 用户名（小写字母/数字）
#   DOCKERHUB_TOKEN     Docker Hub Access Token，权限选 Read & Write
#                       生成地址：https://hub.docker.com/settings/security
#   两者缺一，构建会在「登录 Docker Hub」或生成 tag 时失败。
#
# ── 为什么 runner 上不用装 QEMU ───────────────────────────────
# Dockerfile 的 builder 固定跑在 $BUILDPLATFORM：runner 是 amd64，arm64
# 走 aarch64 工具链交叉编译。本地与 CI 同一套交叉编译路径，无需
# setup-qemu-action，也没有 QEMU 模拟下 Rust 编译慢几十倍的问题。
#
# ── 缓存 ─────────────────────────────────────────────────────
# type=gha 把 BuildKit 缓存挂到 Actions cache：Dockerfile 的「桩依赖层」
# 首次编完整棵依赖树后落缓存，之后每次构建直接命中，只剩源码层重编。
#
# ── action 版本 ──────────────────────────────────────────────
# 与 build.yml 同一标准：直接钉最新大版本（checkout v7 / setup-buildx v4 /
# login v4 / metadata v6 / build-push v7）。

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: read

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/agent2api

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 设置 buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # latest 恒定产出；v* tag 额外产出版本号；每次都带一个短 SHA
      - name: 生成镜像 tag
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: 构建并推送
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max